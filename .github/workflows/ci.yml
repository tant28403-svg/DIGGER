name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: syntax and shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax
        run: |
          bash -n digger.sh
          bash -n install.sh
          bash -n tests/smoke.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          # Passes clean at warning level today; keep it that way.
          shellcheck --severity=warning digger.sh install.sh tests/smoke.sh

  test:
    name: smoke tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: install the optional tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq dnsutils nmap openssl whois iputils-ping traceroute mtr-tiny

      - name: run the suite
        run: bash tests/smoke.sh

      - name: install.sh smoke
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/bin" --copy
          "$RUNNER_TEMP/bin/digger" --version
          ./install.sh --prefix "$RUNNER_TEMP/bin" --uninstall
